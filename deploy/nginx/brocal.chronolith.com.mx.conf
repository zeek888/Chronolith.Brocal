# Sitio brocal.chronolith.com.mx para el Nginx del servidor (el mismo que publica chronolith.com.mx). Ver
# docs/produccion.md.
#   sudo cp deploy/nginx/brocal.chronolith.com.mx.conf /etc/nginx/sites-available/brocal.chronolith.com.mx
# Se instala como sitio HTTP; `certbot --nginx` le agrega el certificado, `listen 443 ssl` y la redirección de http
# a https. Todo va a brocal-web, publicado solo en 127.0.0.1 (BROCAL_WEB_PORT de deploy/.env).

server {
    listen 80;
    listen [::]:80;
    server_name brocal.chronolith.com.mx;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Fotos de evidencia, expedientes y comprobantes (la API acepta hasta 25 MB por archivo).
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8094;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Reportes mensuales y exportaciones a Excel de periodos largos.
        proxy_read_timeout 180s;
    }
}
